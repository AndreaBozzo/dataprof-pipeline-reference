[project]
name = "dataprof-pipeline-reference"
version = "0.1.1"
description = "Reference pipeline: dlt loads, dataprof and SQL gate, DuckDB publishes atomically."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Andrea Bozzo" }]
dependencies = [
    "dataprof==0.13.1",
    "dlt[duckdb]==1.31.0",
    "duckdb==1.5.6",
    "pyarrow==26.0.0",
    "portalocker==4.4.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "ty>=0.0.91",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_reference"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Spikes are kept as recorded evidence, not maintained code.
extend-exclude = ["spikes"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
# Spikes are kept as recorded evidence, not maintained code.
exclude = ["spikes"]

[[tool.ty.overrides]]
# Tests read a run back through Result.run_id and latest_evaluation(), both Optional
# because a run can fail before it exists. A None there fails the test at once, so
# narrowing each of the ~70 sites would add asserts that guard nothing.
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# sqlglot 30.22.0 breaks dlt 1.31.0 dataset lineage (dlt-hub/dlt#4537).
constraint-dependencies = ["sqlglot<30.22"]
